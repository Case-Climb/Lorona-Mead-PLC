name: Daily site rebuild

# Blog posts are written ahead of time with future dates and appear on the
# site on their publish date. This rebuilds the Vercel site every morning so
# sitemap.xml, the RSS feed and the prerendered post pages include each post
# from its first day. Needs the VERCEL_DEPLOY_HOOK secret: Vercel → Project
# Settings → Git → Deploy Hooks → create one for the main branch, copy the URL.
on:
  schedule:
    - cron: "7 13 * * *" # 6:07 AM Arizona time
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret is not set; skipping rebuild."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
