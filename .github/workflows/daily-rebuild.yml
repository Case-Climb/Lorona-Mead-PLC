name: Daily site rebuild

# Optional backup for Grok task 2 in docs/blog-automation.md. Blog posts are
# written ahead of time with future dates; rebuilding on the publish date adds
# each one to sitemap.xml, the RSS feed and the prerendered pages. Does nothing
# unless the VERCEL_DEPLOY_HOOK secret is set (Vercel → Project Settings → Git
# → Deploy Hooks → create one for the main branch, copy the URL).
on:
  schedule:
    - cron: "7 13 * * *" # 6:07 AM Arizona time
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret is not set; skipping rebuild."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
